plugins {
	id 'fabric-loom' version '1.14.9'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories here as needed, e.g. for Sodium/Lithium/Starlight from Modrinth:
	// maven { url "https://api.modrinth.com/maven" ; name = "Modrinth" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"obsidian-client" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Performance mods (uncomment once matching Modrinth builds for this MC version
	// are confirmed at https://modrinth.com/mod/sodium, /lithium, /starlight).
	// modImplementation "maven.modrinth:sodium:<version>"
	// modImplementation "maven.modrinth:lithium:<version>"
	// modImplementation "maven.modrinth:starlight:<version>"

	// JSON config persistence
	implementation "com.google.code.gson:gson:2.11.0"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	withSourcesJar()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

jar {
	from("LICENSE")
}
